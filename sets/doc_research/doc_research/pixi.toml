# Standalone pixi manifest for the research notebook.
#
# It lives inside doc_research/, so it cannot collide with whatever manifest the
# repository above already has: pixi at the repository root keeps using that one,
# and this file is only picked up when running from here.
#
#   cd doc_research && pixi run check
#
# pixi is entirely optional. The notebook's scripts are stdlib-only and run from
# anywhere with plain python3 — see CLAUDE.md. Your own code keeps its own
# environment.

[workspace]
name = "research-notebook"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.11"

[tasks]
# The gate: unchecked code, missing figure captions, entries out of order.
# --write also rebuilds the include lists and refreshes INDEX.md.
check = "python scripts/check.py"

# Regenerate labbook/entries.tex and log/weeks.tex from the directories.
entries = "python scripts/build_entries.py"

# Start this week's summary from git history.
week = "python scripts/weekly.py"

# Pull newer instructions from upstream. See UPDATING.md.
update = "bash scripts/update.sh"

# The PDFs build with the SYSTEM TeX installation (MacTeX on macOS); TeX Live is
# deliberately not pulled into the pixi environment.
labbook = "latexmk -pdf -interaction=nonstopmode labbook.tex"
worklog = "latexmk -pdf -interaction=nonstopmode worklog.tex"
clean = "latexmk -C labbook.tex && latexmk -C worklog.tex"
